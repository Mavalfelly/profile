services:
  - type: web
    name: portfolio-analytics-server
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: PORT
        value: 3001
    healthCheckPath: /health

  - type: web
    name: portfolio
    buildCommand: npm ci && npm run test:ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_EMAILJS_SERVICE_ID
        sync: false
      - key: VITE_EMAILJS_TEMPLATE_ID
        sync: false
      - key: VITE_EMAILJS_PUBLIC_KEY
        sync: false
      - key: VITE_ANALYTICS_API
        value: https://portfolio-analytics-server.onrender.com/api
