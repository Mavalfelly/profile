apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
  namespace: portfolio
  labels:
    app: portfolio-backend
spec:
  replicas: 1 # Only one replica to avoid race conditions on the analytics file
  selector:
    matchLabels:
      app: portfolio-backend
  template:
    metadata:
      labels:
        app: portfolio-backend
    spec:
      containers:
      - name: backend
        # IMPORTANT: Replace with your own image path
        image: mavalfelly25/portfolio-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: email-credentials
        env:
        - name: ANALYTICS_FILE_OVERRIDE
          value: /app/data/analytics-data.json
        volumeMounts:
        - name: analytics-data-storage
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: analytics-data-storage
        persistentVolumeClaim:
          claimName: analytics-data-pvc
