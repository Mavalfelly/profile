apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: portfolio
  annotations:
    # Traefik-specific annotations (k3s default ingress controller)
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: "your-domain.com" # IMPORTANT: Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio-frontend-svc
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: portfolio-backend-svc
            port:
              number: 80
